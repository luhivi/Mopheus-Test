# Tests never touch ./data: a shared in-memory database would otherwise collide with a running
# demo process holding the file lock, and a file database would leak state between test runs.
# This file replaces src/main/resources/application.properties on the test classpath, so the
# Jackson strictness flags below are repeated on purpose.
spring.datasource.url=jdbc:h2:mem:taskboard-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.fail-on-unknown-properties=true

spring.application.name=taskboard-test