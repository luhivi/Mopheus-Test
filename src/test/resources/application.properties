# Test store: a private in-memory database per test JVM.
#
# Never a file URL. The demo writes ./data/taskboard and H2 locks a file database to one process,
# so a test run against ./data would either fail on the lock or, worse, run against the board a
# demo is showing. DB_CLOSE_DELAY=-1 keeps the DB alive for the whole context because Spring's
# connection pool opens and closes connections between tests.
spring.datasource.url=jdbc:h2:mem:taskboard-test;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

server.port=0
spring.application.name=taskboard

spring.jackson.deserialization.fail-on-numbers-for-enums=true
spring.jackson.deserialization.fail-on-unknown-properties=true