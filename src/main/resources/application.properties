server.port=8080
spring.application.name=taskboard

# Enums are part of the contract by name ("TODO"/"DOING"/"BLOCKED"/"DONE"). Without this,
# Jackson accepts the ordinal as well, so {"status": 2} would quietly mean BLOCKED.
spring.jackson.deserialization.fail-on-numbers-for-enums=true

# A misspelled field ("priorty") must be an error, not a silent drop. This matters most on PUT,
# which is a full replacement: a typo there would reset priority to its default and the caller
# would have no way to tell. Strictness elsewhere in JacksonStrictConfig is pointless if the
# field name itself can be wrong without anyone noticing.
spring.jackson.deserialization.fail-on-unknown-properties=true
